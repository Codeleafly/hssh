name: hssh-test

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download hssh v1.0.0 (linux-amd64)
        run: |
          curl -L -o hssh https://github.com/Codeleafly/hssh/releases/download/v1.0.0/hssh-linux-amd64
          chmod +x hssh
          ./hssh version

      - name: Install cloudflared
        run: |
          curl -L -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/
          cloudflared --version

      - name: Run hssh testing server (cloudflare, no token)
        run: |
          ./hssh host --port 8080 --public cloudflare --allow-unauthenticated
