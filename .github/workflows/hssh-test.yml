name: hssh-test

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download hssh v1.0.0 (linux-amd64)
        run: |
          curl -L -o hssh https://github.com/Codeleafly/hssh/releases/download/v1.0.0/hssh-linux-amd64
          chmod +x hssh
          ./hssh version

      - name: Install cloudflared
        run: |
          curl -L -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/
          cloudflared --version

      - name: Start hssh and capture URL
        run: |
          ./hssh host --port 8080 --public cloudflare --allow-unauthenticated > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 60); do
            sleep 2
            URL=$(grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' server.log | head -n 1)
            if [ -n "$URL" ]; then
              echo "$URL" | tee url.txt
              echo "### Public URL $URL" >> "$GITHUB_STEP_SUMMARY"
              echo "FOUND_URL=$URL"
              break
            fi
          done
          cat server.log
          test -f url.txt

      - name: Upload URL artifact
        uses: actions/upload-artifact@v4
        with:
          name: hssh-url
          path: url.txt

      - name: Keep alive (tail logs until timeout)
        run: |
          tail -f server.log --pid="$(cat server.pid)" &
          wait "$(cat server.pid)"
